services:
  postgres:
    image: postgres:16-alpine
    container_name: flowledger-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flowledger
      POSTGRES_PASSWORD: flowledger
      POSTGRES_DB: flowledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger -d flowledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
